# Named {targets} projects (ROADMAP S3.1). Select one with the TAR_PROJECT
# environment variable, then call tar_make() / tar_read() / tar_visnetwork()
# without script = / store = arguments:
#
#   Sys.setenv(TAR_PROJECT = "assign_taxo"); targets::tar_make()
#
# The *_mini projects run the same script on the mini_* databases (config.R
# sets mini_db from the project name) and write to their own store, so a smoke
# test can never overwrite a production store.
dada2:
  script: pipelines/dada2.R
  store: store_dada2
assign_taxo:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo
assign_taxo_mini:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo_mini
cross_val:
  script: pipelines/cross_val.R
  store: store_cross_val
cross_val_mini:
  script: pipelines/cross_val.R
  store: store_cross_val_mini
# Biological-community datasets (D1c). One pair per dataset: dada2_<dataset>
# builds the phyloseq from fastq with pipelines/dada2_bio.R, assign_taxo_<dataset>
# runs the usual assignment grid on it. config.R derives the dataset key and the
# DADA2 store from TAR_PROJECT, so the production projects are untouched.
dada2_tedersoo_illumina:
  script: pipelines/dada2_bio.R
  store: store_dada2_tedersoo_illumina
assign_taxo_tedersoo_illumina:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo_tedersoo_illumina
# In silico reads (D1b, InSilicoSeq). Same pair as a biological dataset: the
# reads come from data/data_raw/insilico and carry no primer site, so
# config.R::bio_datasets gives them fw_primer = NA and dada2_bio.R skips
# cutadapt (OD 29). Positive control only: the reads are generated from records
# of Unite_s_all_20250219, which is also a benchmarked database, so a
# UNITE-vs-EUKARYOME contrast on this set would measure the leak (OD 29).
dada2_insilico:
  script: pipelines/dada2_bio.R
  store: store_dada2_insilico
assign_taxo_insilico:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo_insilico
# Third mock (OD 42): Rolling et al. 2022, ITS1F / 5.8S-1R, reads of both
# orientations in R1 (cutadapt --revcomp, config.R::bio_datasets).
dada2_rolling_mock:
  script: pipelines/dada2_bio.R
  store: store_dada2_rolling_mock
assign_taxo_rolling_mock:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo_rolling_mock
# Species by exact match (OD 43): reads the inputs and blastn tables of every
# assignment store, so it runs after them. species_mini: Pauvert and Tedersoo
# against Unite_all_20250219_Fungi only.
species:
  script: pipelines/species.R
  store: store_species
species_mini:
  script: pipelines/species.R
  store: store_species_mini
# Published OTU tables (D1c, OD 30): the dada2_ project of these datasets runs
# pipelines/load_bio.R, which builds d_asv from the deposit instead of fastq,
# into the same store name, so assign_taxo_<dataset> is unchanged.
dada2_gssp_air:
  script: pipelines/load_bio.R
  store: store_dada2_gssp_air
assign_taxo_gssp_air:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo_gssp_air
dada2_korhonen_wood:
  script: pipelines/load_bio.R
  store: store_dada2_korhonen_wood
assign_taxo_korhonen_wood:
  script: pipelines/assign_taxo.R
  store: store_assign_taxo_korhonen_wood
