# Quarto project for the benchmark analysis (ROADMAP S3.3).
#
# Render everything:        quarto render analysis
# Render one chapter:       quarto render analysis/02_q1_methods.qmd
# Chapters read their inputs from analysis/_cache/, written by
# 01_load_and_clean.qmd; render that one first (or the whole project).
# sandbox/ is not rendered by default.
project:
  type: default
  execute-dir: project
  output-dir: _output
  render:
    # in_silico first: 07_q4_its_region.qmd reads the res_insilico cache it writes.
    - "in_silico_simulation.qmd"
    - "0*.qmd"
    # Chapter 06 (cross-validation, parked by OD 28) is in
    # Archives/cross_val/ since 2026-10-07 (code review §4.3, §8).

execute:
  # No freeze: chapters exchange data through analysis/_cache/ and switch
  # stores with BENCHMARK_ANALYSIS_MINI, neither of which Quarto can see, so a
  # frozen chapter could silently show results from another store.
  freeze: false
  warning: false
  message: false

format:
  html:
    toc: true
    toc-depth: 3
    embed-resources: true
    fig-width: 10
    fig-height: 6
